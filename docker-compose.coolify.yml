# Production stack for Coolify (ADR-0005).
#
# Deployed as a single Coolify "Compose" resource on the Colima VM. Every
# secret is interpolated from Coolify per-resource environment variables —
# nothing is committed. Missing required variables fail `docker compose
# config` with the "<VAR> required" message, so a misconfigured deploy stops
# early instead of shipping with empty credentials.
#
# Layout:
#   app      - minimal Next.js standalone server (Dockerfile `runner` target),
#              non-root, talks to Inngest Cloud, reaches LM Studio on the
#              macOS host via host.docker.internal.
#   migrate  - one-shot deploy step (Dockerfile `migrator` target): applies
#              `pnpm db:migrate` against Postgres; the app only starts when it
#              has completed successfully, so the server never runs ahead of
#              the schema.
#   postgres - single app database; internal only.
#   minio    - object storage; webhook sent to the app over the compose
#              network (service name `app`, not host.docker.internal).
#   minio-init - one-shot job: bucket + bucket-notification event + CORS.
#   backup   - nightly same-box backups (see T12): pg_dump + mc mirror.
#
# No host ports are published for app/minio/postgres — the Cloudflare tunnel
# is the only ingress: one wildcard route (*.tribi.dev → http://localhost:80)
# forwards everything to the Coolify Traefik proxy (T15), which routes by
# domain to services on the compose network. Domains are set per service on
# the Coolify resource, not in this file.

name: receipt-app

services:
  app:
    build:
      context: .
      target: runner
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-receipts}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      MINIO_WEBHOOK_SECRET: ${MINIO_WEBHOOK_SECRET:?MINIO_WEBHOOK_SECRET required}
      MINIO_BUCKET: ${MINIO_BUCKET:-receipts}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required}
      INVITE_CODE: ${INVITE_CODE:?INVITE_CODE required}
      LM_STUDIO_URL: ${LM_STUDIO_URL:-http://host.docker.internal:1234/v1}
      ORC_MODEL: ${ORC_MODEL:-glm-ocr}
      PARSE_MODEL: ${PARSE_MODEL:-google/gemma-4-e4b}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?INNGEST_EVENT_KEY required}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?INNGEST_SIGNING_KEY required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    healthcheck:
      # Tests that a TCP connection to the Next.js server can be opened,
      # without depending on the database or auth redirects.
      test:
        - CMD-SHELL
        - node -e "const s=require('net').connect(3000,'localhost',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),5000)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-receipts}
    exclude_from_hc: true
    restart: "no"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-receipts}
    volumes:
      # postgres:18 moved PGDATA into a versioned dir under /var/lib/postgresql
      # and its declared VOLUME to /var/lib/postgresql; mounting that root
      # makes the named volume actually hold the database.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      MINIO_NOTIFY_WEBHOOK_ENABLE_primary: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_primary: http://app:3000/api/minio-events
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_primary: ${MINIO_WEBHOOK_SECRET:?MINIO_WEBHOOK_SECRET required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      MINIO_WEBHOOK_SECRET: ${MINIO_WEBHOOK_SECRET:?MINIO_WEBHOOK_SECRET required}
      MINIO_BUCKET: ${MINIO_BUCKET:-receipts}
      RECEIPTS_ORIGIN: ${MINIO_CORS_ORIGIN:-https://receipts.tribi.dev}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc event add "local/$$MINIO_BUCKET" arn:minio:sqs::primary:webhook --event put,delete
        printf '[\n  {\n    "AllowedOrigins": ["%s"],\n    "AllowedMethods": ["PUT", "POST", "GET"],\n    "AllowedHeaders": ["*"]\n  }\n]\n' "$$RECEIPTS_ORIGIN" > /tmp/cors.json
        mc cors set "local/$$MINIO_BUCKET" /tmp/cors.json
    exclude_from_hc: true
    restart: "no"

  backup:
    build:
      context: ./scripts/backup
    environment:
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-receipts}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      MINIO_BUCKET: ${MINIO_BUCKET:-receipts}
    volumes:
      - backups-data:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  backups-data:

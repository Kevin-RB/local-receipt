# Production stack for Coolify (ADR-0005, ADR-0006).
#
# Deployed as a single Coolify "Compose" resource on the Colima VM.
# Credentials use Coolify magic variables (SERVICE_USER_* / SERVICE_PASSWORD_64_*),
# so Coolify generates a secure random value per environment — nothing is
# committed. Non-credential variables (URLs, Inngest keys, model names, ...)
# come from Coolify per-resource environment variables; required variables are
# marked ${VAR:?} (bare, per Coolify docs — a :?text suffix would be treated
# as a default value and litter the env UI), so a misconfigured deploy fails
# `docker compose config` instead of shipping with empty values.
#
# Layout:
#   app        - minimal Next.js standalone server (Dockerfile `runner` target),
#                non-root, talks to Inngest Cloud, reaches LM Studio on the
#                macOS host via host.docker.internal.
#   migrate    - one-shot deploy step (Dockerfile `migrator` target): applies
#                `pnpm db:migrate` against Postgres; the app only starts when it
#                has completed successfully, so the server never runs ahead of
#                the schema.
#   postgres   - single app database; internal only.
#   rustfs     - object storage (ADR-0006); webhook sent to the app over the
#                compose network (service name `app`, not host.docker.internal).
#   rustfs-init - one-shot job: bucket + bucket-notification event.
#
# Host ports exist on postgres/rustfs solely for private admin (LAN and
# Tailscale tailnet): Postgres on ${POSTGRES_HOST_PORT:-55432} (psql/Studio
# tunnels), the RustFS console UI on ${STORAGE_CONSOLE_HOST_PORT:-59001}, and —
# because the RustFS console is a *browser* app that calls the admin API on the
# server listener directly (unlike MinIO's console, which proxied server-side)
# — the RustFS S3/admin API on ${STORAGE_API_HOST_PORT:-59000}. The console's
# Server Configuration (set once per browser) must point at that API address,
# and STORAGE_CONSOLE_ORIGIN is allowlisted in RUSTFS_CORS_ALLOWED_ORIGINS or
# the browser blocks the console's calls. The API port is private admin only:
# the app and rustfs-init still reach rustfs over the compose network, and
# presigned traffic still goes through Traefik. The host side is parameterized
# because prod and staging share one Docker host and must not collide — set
# 55433/59003/59002 (or similar) on the staging resource; prod keeps the
# defaults. Ports are bound to all mini interfaces on purpose — reachable via
# LAN IP and tailnet IP, never from the internet: the router forwards nothing
# inbound and the Cloudflare tunnel is still the only public ingress (one
# wildcard route *.tribi.dev → http://localhost:80 into the Coolify Traefik
# proxy, T15, which routes by domain to services on the compose network).
# Domains are set per service on the Coolify resource, not here. Credentials
# remain the fence (DB password, RustFS access key, Gateway MASTERPASS).

name: receipt-app

services:
  app:
    build:
      context: .
      target: runner
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Bucket + bucket-notification must exist before serving uploads.
      # rustfs-init is the real readiness gate here: a healthcheck alone only
      # proves the server is alive, so a broken cutover surfaces as a failed
      # deploy, not silent 500s.
      rustfs-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${SERVICE_PASSWORD_64_POSTGRES:?}@postgres:5432/${POSTGRES_DB:?}
      STORAGE_ENDPOINT: rustfs:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:?}
      # The app authenticates as its own least-privilege IAM identity, created
      # by rustfs-init — never as root (root bypasses IAM evaluation).
      STORAGE_ACCESS_KEY: receipts-app
      STORAGE_SECRET_KEY: ${SERVICE_PASSWORD_64_STORAGE:?}
      STORAGE_WEBHOOK_SECRET: ${SERVICE_PASSWORD_64_RUSTFSWEBHOOK:?}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_BETTERAUTH:?}
      INVITE_CODE: ${INVITE_CODE:?}
      LM_STUDIO_URL: ${LM_STUDIO_URL:-http://host.docker.internal:1234/v1}
      ORC_MODEL: ${ORC_MODEL:-glm-ocr}
      PARSE_MODEL: ${PARSE_MODEL:-google/gemma-4-e4b}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    healthcheck:
      # Tests that a TCP connection to the Next.js server can be opened,
      # without depending on the database or auth redirects.
      test:
        - CMD-SHELL
        - node -e "const s=require('net').connect(3000,'localhost',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),5000)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${SERVICE_PASSWORD_64_POSTGRES:?}@postgres:5432/${POSTGRES_DB:?}
    exclude_from_hc: true
    restart: "no"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # Declared here as well as in `ports:` because Coolify only scans a
      # service's `environment:` section for variables; a port-only variable is
      # not created, so the `ports:` interpolation silently falls back to its
      # `:-` default. Harmless to the container; makes the variable real.
      POSTGRES_HOST_PORT: ${POSTGRES_HOST_PORT:-55432}
    ports:
      # Private admin only (LAN + tailnet); see file header. Deliberately
      # bound to all interfaces so tailnet IPs route here; not internet
      # reachable (no inbound router forwards, tunnel routes tribi.dev only).
      # Host port is per-environment (prod and staging share one Docker
      # host, so they must not collide): override POSTGRES_HOST_PORT in the
      # staging resource's env vars (e.g. 55433); prod keeps the default.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      # postgres:18 moved PGDATA into a versioned dir under /var/lib/postgresql
      # and its declared VOLUME to /var/lib/postgresql; mounting that root
      # makes the named volume actually hold the database.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  rustfs:
    # RustFS (ADR-0006), digest-pinned for reproducible deploys. Runs as
    # non-root uid 10001 — a pre-existing MinIO data volume must be chowned
    # once before cutover (`chown -R 10001:10001`); the single-node on-disk
    # format is otherwise compatible with MinIO, so cutover is a volume swap.
    image: rustfs/rustfs@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    environment:
      RUSTFS_ACCESS_KEY: ${SERVICE_USER_RUSTFS:?}
      RUSTFS_SECRET_KEY: ${SERVICE_PASSWORD_64_RUSTFS:?}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      # The console is reached over the tailnet at http://<host>:<port>. The
      # origin is derived from those two values so the port is defined only once
      # (it also drives the published port) and can't drift; override
      # STORAGE_CONSOLE_ORIGIN for e.g. HTTPS via `tailscale serve`.
      STORAGE_CONSOLE_HOST: ${STORAGE_CONSOLE_HOST:?}
      STORAGE_CONSOLE_HOST_PORT: ${STORAGE_CONSOLE_HOST_PORT:-59001}
      STORAGE_CONSOLE_ORIGIN: ${STORAGE_CONSOLE_ORIGIN:-http://${STORAGE_CONSOLE_HOST}:${STORAGE_CONSOLE_HOST_PORT}}
      # Browser-upload CORS, server-side, plus the console origin: the console
      # page and the admin API are different origins, so the console's own
      # origin must be allowed for its API calls to succeed. STORAGE_CORS_ORIGIN
      # (the app) is required; a missing value must fail `docker compose config`.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${STORAGE_CORS_ORIGIN:?},${STORAGE_CONSOLE_ORIGIN}
      # Console-listener CORS. Direct browser access to the console is
      # same-origin and never needs this; pinning it to the console origin
      # (rather than the default `*`) just removes a blanket cross-origin
      # allowance on the LAN/tailnet.
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: ${STORAGE_CONSOLE_ORIGIN}
      RUSTFS_NOTIFY_ENABLE: "true"
      RUSTFS_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: http://app:3000/api/storage-events
      RUSTFS_NOTIFY_WEBHOOK_AUTH_TOKEN_PRIMARY: ${SERVICE_PASSWORD_64_RUSTFSWEBHOOK:?}
      # The queue dir must live OUTSIDE the data volume: RustFS treats every
      # top-level directory under /data as a bucket, so a queue dir there
      # shows up as a phantom bucket.
      RUSTFS_NOTIFY_WEBHOOK_QUEUE_DIR_PRIMARY: /logs/notify-primary
      # RustFS HEAD-probes the endpoint origin root before delivering; this
      # allowlist must contain the webhook origin (the app service).
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: http://app:3000
      # Declared here as well as in `ports:` because Coolify only scans a
      # service's `environment:` section for variables; a port-only variable is
      # not created, so the `ports:` interpolation silently falls back to its
      # `:-` default (which collides across prod/staging). Harmless to RustFS.
      STORAGE_API_HOST_PORT: ${STORAGE_API_HOST_PORT:-59000}
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    expose:
      - "9000"
    ports:
      # Private admin (LAN + tailnet): the console UI, and the S3/admin API it
      # calls in the browser (see file header). Both host ports are
      # per-environment (staging e.g. 59002/59003); prod keeps the defaults.
      - "${STORAGE_CONSOLE_HOST_PORT:-59001}:9001"
      - "${STORAGE_API_HOST_PORT:-59000}:9000"
    healthcheck:
      # Readiness: 200 once storage, IAM, and lock are ready, 503 before. This
      # is exactly the signal rustfs-init gates on via service_healthy.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  rustfs-init:
    image: rustfs/rc@sha256:adb45b56539006120f1d790bcc17ee5f9b4d93c1d7e71ed0a24f10267f9d6914
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      # Root credentials: used only here and by the console for break-glass,
      # never by the running app.
      RUSTFS_ACCESS_KEY: ${SERVICE_USER_RUSTFS:?}
      RUSTFS_SECRET_KEY: ${SERVICE_PASSWORD_64_RUSTFS:?}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?}
      # The app's own least-privilege identity (same values the app uses).
      STORAGE_ACCESS_KEY: receipts-app
      STORAGE_SECRET_KEY: ${SERVICE_PASSWORD_64_STORAGE:?}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        i=0
        until rc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"; do
          i=$$(($$i + 1))
          if [ "$$i" -ge 20 ]; then echo "rustfs not reachable, giving up" >&2; exit 1; fi
          sleep 3
        done
        rc bucket create --ignore-existing "local/$$STORAGE_BUCKET"
        # `event add` replaces the rule for this ARN, so running it every deploy
        # is idempotent AND picks up a changed event set. Under `set -e` a
        # failure fails the job loudly (unlike `|| true`, which would hide a
        # broken webhook behind exit 0 and leave receipts stuck `uploading`).
        # `put` expands to s3:ObjectCreated:* — single Put and multipart
        # completion — and the app never consumes delete events.
        rc bucket event add "local/$$STORAGE_BUCKET" arn:rustfs:sqs:us-east-1:primary:webhook --event put
        # Least-privilege identity for the app: root bypasses IAM evaluation, so
        # the app must not run as root. policy/user/attach are create-or-replace,
        # so this is idempotent. Grants exactly the object actions the app uses
        # (presigned PutObject, GetObject, DeleteObject), on this bucket only.
        cat > /tmp/app-policy.json <<JSON
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::$$STORAGE_BUCKET/*"]}]}
        JSON
        rc admin policy create local receipts-app-objects /tmp/app-policy.json
        rc admin user add local "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY"
        rc admin policy attach local receipts-app-objects --user "$$STORAGE_ACCESS_KEY"
    exclude_from_hc: true
    restart: "no"

volumes:
  postgres-data:
  rustfs-data:
  rustfs-logs:

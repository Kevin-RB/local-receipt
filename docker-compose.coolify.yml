# Production stack for Coolify (ADR-0005).
#
# Deployed as a single Coolify "Compose" resource on the Colima VM.
# Credentials use Coolify magic variables (SERVICE_USER_* / SERVICE_PASSWORD_64_*),
# so Coolify generates a secure random value per environment — nothing is
# committed. Non-credential variables (URLs, Inngest keys, model names, ...)
# come from Coolify per-resource environment variables; required variables are
# marked ${VAR:?} (bare, per Coolify docs — a :?text suffix would be treated
# as a default value and litter the env UI), so a misconfigured deploy fails
# `docker compose config` instead of shipping with empty values.
#
# Layout:
#   app      - minimal Next.js standalone server (Dockerfile `runner` target),
#              non-root, talks to Inngest Cloud, reaches LM Studio on the
#              macOS host via host.docker.internal.
#   migrate  - one-shot deploy step (Dockerfile `migrator` target): applies
#              `pnpm db:migrate` against Postgres; the app only starts when it
#              has completed successfully, so the server never runs ahead of
#              the schema.
#   postgres - single app database; internal only.
#   minio    - object storage; webhook sent to the app over the compose
#              network (service name `app`, not host.docker.internal).
#   minio-init - one-shot job: bucket + bucket-notification event + CORS.
#
# Host ports exist on postgres/minio solely for private admin (LAN and
# Tailscale tailnet): Postgres on ${POSTGRES_HOST_PORT:-55432} (psql/Studio
# tunnels) and MinIO console UI on ${MINIO_CONSOLE_HOST_PORT:-59001}. The S3
# API (9000) is deliberately NOT published: the app and minio-init reach it
# over the compose network and presigned traffic goes through Traefik, so a
# host-mapped API port would be surface without a consumer. The host side is
# parameterized because prod and staging run on the same Docker host and must
# not collide — set 55433/59002 (or similar) on the staging resource; prod
# keeps the defaults. Ports are bound to all mini interfaces on purpose — reachable
# via LAN IP and tailnet IP, never from the internet: the router forwards
# nothing inbound and the Cloudflare tunnel is still the only public ingress
# (one wildcard route *.tribi.dev → http://localhost:80 into the Coolify
# Traefik proxy, T15, which routes by domain to services on the compose
# network). Domains are set per service on the Coolify resource, not here.
# Credentials remain the fence (DB password, MinIO root, Gateway MASTERPASS).

name: receipt-app

services:
  app:
    build:
      context: .
      target: runner
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Bucket + bucket-notification must exist before serving uploads.
      # minio-init is the real readiness gate here: the server's
      # `--version` healthcheck only proves the binary is alive, so a
      # broken cutover surfaces as a failed deploy, not silent 500s.
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${SERVICE_PASSWORD_64_POSTGRES:?}@postgres:5432/${POSTGRES_DB:?}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?}
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO:?}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MINIO:?}
      MINIO_WEBHOOK_SECRET: ${SERVICE_PASSWORD_64_MINIOWEBHOOK:?}
      MINIO_BUCKET: ${MINIO_BUCKET:?}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_BETTERAUTH:?}
      INVITE_CODE: ${INVITE_CODE:?}
      LM_STUDIO_URL: ${LM_STUDIO_URL:-http://host.docker.internal:1234/v1}
      ORC_MODEL: ${ORC_MODEL:-glm-ocr}
      PARSE_MODEL: ${PARSE_MODEL:-google/gemma-4-e4b}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    healthcheck:
      # Tests that a TCP connection to the Next.js server can be opened,
      # without depending on the database or auth redirects.
      test:
        - CMD-SHELL
        - node -e "const s=require('net').connect(3000,'localhost',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),5000)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${SERVICE_PASSWORD_64_POSTGRES:?}@postgres:5432/${POSTGRES_DB:?}
    exclude_from_hc: true
    restart: "no"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      # Private admin only (LAN + tailnet); see file header. Deliberately
      # bound to all interfaces so tailnet IPs route here; not internet
      # reachable (no inbound router forwards, tunnel routes tribi.dev only).
      # Host port is per-environment (prod and staging share one Docker
      # host, so they must not collide): override POSTGRES_HOST_PORT in the
      # staging resource's env vars (e.g. 55433); prod keeps the default.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      # postgres:18 moved PGDATA into a versioned dir under /var/lib/postgresql
      # and its declared VOLUME to /var/lib/postgresql; mounting that root
      # makes the named volume actually hold the database.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  minio:
    # Chainguard-maintained MinIO, digest-pinned for reproducible deploys
    # (upstream abandoned Docker Hub; minio/minio no longer pulls).
    # Runs as non-root uid 65532 — the data volume must be writable by it
    # (fresh volumes are fine; pre-existing root-owned volumes need a
    # one-time chown -R 65532:65532 before cutover).
    image: cgr.dev/chainguard/minio@sha256:4d397a26fe49d7f9ed39b8b566534848936f7efa50ab6328ac97b2a44eeabf4c
    command: server /data --console-address ":9001"
    expose:
      - "9000"
    ports:
      # Console UI host port is per-environment like POSTGRES_HOST_PORT
      # above (staging e.g. 59002); prod keeps the default. No S3 API
      # mapping (see file header).
      - "${MINIO_CONSOLE_HOST_PORT:-59001}:9001"
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO:?}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MINIO:?}
      # Browser-upload CORS, server-side: the Chainguard mc build cannot
      # `cors set` against current servers (`decoding xml: EOF`), so the
      # bucket-CORS file dance is dropped in favor of this env (verified:
      # staging upload flow is the proof). Pre-existing volumes keep any
      # bucket CORS config already stored in them.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGIN:-https://receipts.tribi.dev}
      MINIO_NOTIFY_WEBHOOK_ENABLE_primary: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_primary: http://app:3000/api/minio-events
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_primary: ${SERVICE_PASSWORD_64_MINIOWEBHOOK:?}
    volumes:
      - minio-data:/data
    healthcheck:
      # The Chainguard image ships no shell/curl, so a `--version` alive
      # check is the strongest signal available here. minio-init retries
      # its first connection to cover a cold server.
      test: ["CMD", "minio", "--version"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    # -dev variant (has /bin/sh); digest-pinned like the server above.
    image: cgr.dev/chainguard/minio-client@sha256:db1f316672f27220a5cba9d53335684ef4c40fb94b039629c560cd865fd881bd
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO:?}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MINIO:?}
      MINIO_WEBHOOK_SECRET: ${SERVICE_PASSWORD_64_MINIOWEBHOOK:?}
      MINIO_BUCKET: ${MINIO_BUCKET:?}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$(($$i + 1))
          if [ "$$i" -ge 20 ]; then echo "minio not reachable, giving up" >&2; exit 1; fi
          sleep 3
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        # Idempotent without masking real failures: only skip when this
        # exact notification is already registered; anything else fails
        # the job loudly (unlike `|| true`, which would hide a broken
        # webhook behind exit 0 and leave receipts stuck `uploading`).
        if ! mc event list "local/$$MINIO_BUCKET" 2>/dev/null | grep -q "arn:minio:sqs::primary:webhook"; then
          mc event add "local/$$MINIO_BUCKET" arn:minio:sqs::primary:webhook --event put,delete
        fi
    exclude_from_hc: true
    restart: "no"

volumes:
  postgres-data:
  minio-data:

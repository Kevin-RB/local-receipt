name: sync-inngest

# After Coolify's GitHub App deploys a merge, tell Inngest Cloud about the new
# function manifest. Ordering is load-bearing: an early sync registers the
# previous definitions, so we first wait for the deployment of this exact
# commit to finish, then call the documented sync endpoint. The app itself is
# not involved beyond serving /api/inngest.
#
# The branch selects the GitHub environment (see `environment:` below), whose
# variables carry the per-environment target — so no environment-specific
# values live in this file. See ADR-0005 ("Update (2026-10-09)").

on:
  push:
    branches:
      - main
      - staging
  # A rollback or manual redeploy changes the live manifest without a push, so
  # this is also dispatchable: run it from the branch to resync on demand.
  workflow_dispatch:

# A newer push supersedes an in-flight wait on the same branch.
concurrency:
  group: sync-inngest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync Inngest after deploy
    runs-on: ubuntu-latest
    # `main` deploys production, `staging` deploys staging. The environment's
    # variables (COOLIFY_APP_UUID, APP_URL, INNGEST_ENV) are set in repo
    # settings; see AGENTS.md.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 11.20.0
          runtime: node@26
          install: false

      - name: Guard the branch
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            main|staging) ;;
            *) echo "Unsupported branch ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac

      - name: Wait for the Coolify deployment to finish
        env:
          COOLIFY_URL: https://coolbox.tribi.dev
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COMMIT: ${{ github.sha }}
          TIMEOUT_SECONDS: 1800
        run: node ./scripts/wait-for-deploy.ts

      - name: Sync the Inngest app
        env:
          INNGEST_API_KEY: ${{ secrets.INNGEST_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          # The key is environment-scoped (one per GitHub environment), so the
          # target environment is implied and no X-Inngest-Env header is needed.
          # "Deployment finished" can precede the app accepting requests (its
          # boot script waits on LM Studio), and the sync is a pull, so retry
          # the whole error space for a couple of minutes before giving up.
          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-delay 20 --retry-all-errors --retry-connrefused \
            --request POST \
            "https://api.inngest.com/v2/apps/receipt-analyser/syncs" \
            --header "Authorization: Bearer ${INNGEST_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(printf '{"url":"%s/api/inngest"}' "${APP_URL}")"

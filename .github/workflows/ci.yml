name: ci

on:
  pull_request:
    branches:
      - main
      - staging
    # `edited` is not a default activity type. Without it, retargeting a PR's
    # base (e.g. un-stacking after the parent merges) does not run CI, because
    # changing the base emits `edited` — and the base branch is what the
    # `branches` filter matches on.
    types:
      - edited
      - opened
      - reopened
      - synchronize

jobs:
  quality:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 12.15.0
          runtime: node@26
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

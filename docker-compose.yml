services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: receipts
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receipts"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_NOTIFY_WEBHOOK_ENABLE_primary: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_primary: http://next:3000/api/minio-events
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_primary: local-webhook-secret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/receipts
        echo '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["PUT"],"AllowedHeaders":["*"]}]}' > /tmp/cors.json
        mc anonymous set-json /tmp/cors.json local/receipts
        mc event add local/receipts arn:minio:sqs::primary:webhook --event put

  inngest:
    image: inngest/inngest:latest
    command:
      - "inngest"
      - "dev"
      - "-u"
      - "http://next:3000/api/inngest"
      - "--no-discovery"
      - "--port"
      - "8288"
    ports:
      - "8288:8288"
      - "8289:8289"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8288'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      next:
        condition: service_healthy

  next:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/receipts
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_WEBHOOK_SECRET: local-webhook-secret
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_EVENT_KEY: local
      INNGEST_SIGNING_KEY: local
      LM_STUDIO_URL: http://host.docker.internal:1234/v1
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  minio-data:

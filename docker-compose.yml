services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: receipts
    volumes:
      # postgres:18 moved PGDATA into a versioned dir under /var/lib/postgresql;
      # the named volume must cover that root to actually persist the database.
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receipts"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: receipt-app
      MINIO_ROOT_PASSWORD: possum123
      MINIO_NOTIFY_WEBHOOK_ENABLE_primary: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_primary: http://host.docker.internal:3000/api/minio-events
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_primary: local-webhook-secret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 receipt-app possum123
        mc mb --ignore-existing local/receipts
        mc event add local/receipts arn:minio:sqs::primary:webhook --event put,delete

  inngest:
    image: inngest/inngest:latest
    command:
      - "inngest"
      - "dev"
      - "-u"
      - "http://host.docker.internal:3000/api/inngest"
      - "--no-discovery"
      - "--port"
      - "8288"
    ports:
      - "8288:8288"
      - "8289:8289"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8288'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  minio-data:
